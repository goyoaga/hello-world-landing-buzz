<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A bright, friendly Hello World landing page.">
  <title>Hello World</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17213c;
      --muted: #526078;
      --card: rgba(255, 255, 255, 0.78);
      --purple: #7c4dff;
      --pink: #ff5c8a;
      --yellow: #ffd166;
      --cyan: #31d7c9;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, ui-rounded, "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 18%, rgba(255, 209, 102, .95) 0 9%, transparent 28%),
        radial-gradient(circle at 87% 12%, rgba(49, 215, 201, .85) 0 10%, transparent 29%),
        radial-gradient(circle at 82% 88%, rgba(255, 92, 138, .75) 0 8%, transparent 30%),
        linear-gradient(135deg, #fff7db 0%, #f7e9ff 48%, #dffcff 100%);
    }

    .blob {
      position: fixed;
      width: 190px;
      aspect-ratio: 1;
      border-radius: 55% 45% 62% 38% / 42% 58% 42% 58%;
      filter: blur(1px);
      opacity: .75;
      animation: float 8s ease-in-out infinite;
    }

    .blob.one { top: -58px; right: 18%; background: var(--pink); }
    .blob.two { bottom: -80px; left: 8%; background: var(--purple); animation-delay: -3s; }

    main {
      position: relative;
      z-index: 1;
      width: min(760px, 100%);
      padding: clamp(40px, 8vw, 80px);
      text-align: center;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.86);
      border-radius: 36px;
      box-shadow: 0 28px 80px rgba(56, 44, 105, .18);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 22px;
      padding: 9px 14px;
      border-radius: 999px;
      color: #6037d4;
      background: #eee6ff;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 0 5px rgba(49, 215, 201, .2);
    }

    h1 {
      margin: 0;
      font-size: clamp(4rem, 14vw, 8.5rem);
      line-height: .88;
      letter-spacing: -.075em;
    }

    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(90deg, var(--purple), var(--pink), #ff9f1c);
      -webkit-background-clip: text;
      background-clip: text;
    }

    p {
      max-width: 470px;
      margin: 28px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      line-height: 1.65;
    }

    .sparkle {
      position: absolute;
      font-size: 2rem;
      animation: twinkle 2.4s ease-in-out infinite;
    }

    .sparkle.a { top: 26px; left: 32px; color: var(--pink); }
    .sparkle.b { right: 35px; bottom: 27px; color: var(--purple); animation-delay: -1.2s; }

    @keyframes float { 50% { transform: translateY(18px) rotate(9deg); } }
    @keyframes twinkle { 50% { transform: scale(.65) rotate(18deg); opacity: .5; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="blob one" aria-hidden="true"></div>
  <div class="blob two" aria-hidden="true"></div>
  <main>
    <span class="sparkle a" aria-hidden="true">✦</span>
    <span class="sparkle b" aria-hidden="true">✦</span>
    <div class="eyebrow">A tiny page with big energy</div>
    <h1>Hello<span>World!</span></h1>
    <p>A colorful little corner of the internet, made to brighten your day and welcome every new possibility.</p>
  </main>
</body>
</html>
